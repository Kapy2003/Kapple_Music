<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src file: blob:; connect-src https://music.apple.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapple Music</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #f5f5f7;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; -webkit-app-region: drag; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  p  { margin: 0; color: #a1a1a6; max-width: 34em; }
  small { color: #6e6e73; }
  button { -webkit-app-region: no-drag; margin-top: 8px; padding: 9px 22px; border: 0; border-radius: 8px;
    background: #fc3c44; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #offline-player { display: none; width: 100%; max-width: 440px; margin-top: 18px; text-align: left; -webkit-app-region: no-drag; background: rgba(255,255,255,0.06); padding: 14px 16px; border-radius: 12px; }
  #track-list { max-height: 180px; overflow-y: auto; margin: 8px 0; padding: 0; list-style: none; }
  #track-list li { padding: 6px 10px; cursor: pointer; border-radius: 6px; font-size: 13px; color: #e1e1e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #track-list li:hover { background: rgba(255,255,255,0.1); }
  #track-list li.playing { background: rgba(252,60,68,0.22); color: #fc3c44; font-weight: 600; }
  audio { width: 100%; margin-top: 6px; }
</style>
</head>
<body>
<main role="main">
  <h1 id="title">Kapple Music</h1>
  <p id="msg">Apple Music could not be loaded.</p>
  <p>Kapple Music will reconnect on its own as soon as the network is back.</p>
  <button id="retry" type="button">Try again</button>
  <small id="detail"></small>
  <div id="offline-player">
    <div style="font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px;">Downloaded Music</div>
    <ul id="track-list"></ul>
    <audio id="audio-el" controls></audio>
  </div>
</main>
<script>
  const target = 'https://music.apple.com/';
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('m')) document.getElementById('msg').textContent = q.get('m') + '.';
  if (q.get('d')) document.getElementById('detail').textContent = q.get('d');
  const go = () => { location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
  // Probe quietly; only navigate once Apple Music answers, so a dead network does not flash-reload.
  setInterval(() => { fetch(target, { mode: 'no-cors', cache: 'no-store' }).then(go, () => {}); }, 6000);

  if (window.offlineBridge?.getDownloads) {
    window.offlineBridge.getDownloads().then(tracks => {
      if (!tracks || !tracks.length) return;
      const container = document.getElementById('offline-player');
      const list = document.getElementById('track-list');
      const audio = document.getElementById('audio-el');
      container.style.display = 'block';
      tracks.forEach((t) => {
        const li = document.createElement('li');
        li.textContent = t.title || t.name;
        li.addEventListener('click', () => {
          Array.from(list.children).forEach(c => c.classList.remove('playing'));
          li.classList.add('playing');
          audio.src = 'file://' + encodeURI(t.path);
          audio.play().catch(() => {});
        });
        list.appendChild(li);
      });
    }).catch(() => {});
  }
</script>
</body>
</html>
