# Flatpak packaging for Kapple Music (self-hosted: a .flatpak bundle on the GitHub release).
# Build with scripts/build-flatpak.sh. It wraps the unpacked Electron app produced by
# `npm run dist` / scripts/build-installer.sh, so the engine, DRM libraries and VLC are the
# same files as in the other packages.
app-id: io.github.Kapy2003.KappleMusic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: kapple-music
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.*
  # Discord Rich Presence: the host socket and the Flatpak/Snap variants.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/snap.discord:create
modules:
  - name: kapple-music
    buildsystem: simple
    build-commands:
      - mkdir -p /app/kapple-music
      - cp -a linux-unpacked/. /app/kapple-music/
      - install -Dm755 kapple-music.sh /app/bin/kapple-music
      - install -Dm644 io.github.Kapy2003.KappleMusic.desktop /app/share/applications/io.github.Kapy2003.KappleMusic.desktop
      - install -Dm644 io.github.Kapy2003.KappleMusic.metainfo.xml /app/share/metainfo/io.github.Kapy2003.KappleMusic.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.Kapy2003.KappleMusic.png
    sources:
      - type: dir
        path: ../electron/dist/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: kapple-music.sh
      - type: file
        path: io.github.Kapy2003.KappleMusic.desktop
      - type: file
        path: io.github.Kapy2003.KappleMusic.metainfo.xml
      - type: file
        path: icon-512.png
